[project]
name = "waifu"
version = "0.1.0"
description = ""
authors = [{ name = "phillychi3", email = "phillychi3@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "waifu_types",
    "textual>=0.89.1",
    "peewee>=3.17",
    "tomli-w>=1.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
waifu = "waifu.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["test"]

[tool.ruff]
lint.select = ["ASYNC", "ARG", "B", "C", "C4", "E", "F", "Q", "W", "I"]

lint.ignore = ["F401"]

lint.unfixable = ["F401"]

line-length = 120

[tool.uv.workspace]
members = ["waifu_sdk", "waifu_types"]

[tool.uv.sources]
waifu_types = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ftfy>=6.0",
    "uvicorn[standard]>=0.30",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
