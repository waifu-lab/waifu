[project]
name = "waifucore"
version = "0.1.0"
description = ""
authors = [{ name = "phillychi3", email = "phillychi3@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT License" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "python-multipart>=0.0.30",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "textual>=0.89.1",
    "peewee>=3.17",
    "croniter>=2.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "rich>=13.0",
    "shuvi>=0.1.2",
    "hydrogen-ai>=0.1.3",
]

[project.optional-dependencies]
discord = ["discord-py>=2.7.1"]
telegram = ["python-telegram-bot>=22.7"]
all = ["discord-py>=2.7.1", "python-telegram-bot>=22.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waifu", "waifu_types/waifu_types"]

[project.scripts]
waifu = "waifu.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "waifu_types", "waifu_sdk"]
testpaths = ["test"]

[tool.ruff]
lint.select = ["ASYNC", "ARG", "B", "C", "C4", "E", "F", "Q", "W", "I"]

lint.ignore = ["F401"]

lint.unfixable = ["F401"]

line-length = 120

[tool.uv.workspace]
members = ["waifu_sdk", "waifu_types"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "ftfy>=6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "discord-py>=2.7.1",
    "python-telegram-bot>=22.7",
]

[tool.pyright]
include = ["waifu", "waifu_sdk", "waifu_types"]

pythonVersion = "3.10"

typeCheckingMode = "basic"

reportPrivateUsage = false
